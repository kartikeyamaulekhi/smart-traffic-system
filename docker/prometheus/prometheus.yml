# Prometheus scrape configuration for the Smart Traffic System.
# Each Spring Boot service exposes Micrometer metrics at /actuator/prometheus;
# the Python ml-service exposes them at /metrics. Prometheus runs inside the
# same Docker network as the services, so targets are reachable by service name.
#   UI: http://localhost:9090  (targets at /targets, query at /graph)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8091"]

  - job_name: traffic-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["traffic-service:8082"]

  - job_name: routing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["routing-service:8083"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8010"]