services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: smart-traffic-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - smart-traffic-pgdata:/var/lib/postgresql/data
      # Runs once on first boot to create the per-service databases.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-traffic-redis
    ports:
      - "6379:6379"
    volumes:
      - smart-traffic-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: smart-traffic-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/auth-service
    container_name: smart-traffic-auth
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_traffic_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy

  traffic-service:
    build: ./traffic-service
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/traffic-service
    container_name: smart-traffic-traffic
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_traffic_traffic
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-demo-key-replace-me}
      ML_SERVICE_URL: http://ml-service:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  routing-service:
    build: ./routing-service
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/routing-service
    container_name: smart-traffic-routing
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      TRAFFIC_SERVICE_URL: http://traffic-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      traffic-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/api-gateway
    container_name: smart-traffic-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      AUTH_SERVICE_URL: http://auth-service:8091
      TRAFFIC_SERVICE_URL: http://traffic-service:8082
      ROUTING_SERVICE_URL: http://routing-service:8083
    depends_on:
      - auth-service
      - traffic-service
      - routing-service

  ml-service:
    build: ./ml-service
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/ml-service
    container_name: smart-traffic-ml
    ports:
      - "8010:8010"
    volumes:
      # Persist the trained model so it survives container recreation. Train
      # first with: docker compose exec ml-service python train.py
      - smart-traffic-mlmodels:/app/models
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smart_traffic_traffic  # traffic_data lives in traffic-service's DB
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ghcr.io/kartikeyamaulekhi/smart-traffic-system/frontend
    container_name: smart-traffic-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  smart-traffic-pgdata:
  smart-traffic-redisdata:
  smart-traffic-mlmodels:
