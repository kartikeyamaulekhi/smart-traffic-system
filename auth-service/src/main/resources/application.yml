spring:
  application:
    name: auth-service

  profiles:
    active: postgres

  flyway:
    enabled: true
    # baseline-on-migrate: when Flyway starts against an existing DB (created by
    # Hibernate ddl-auto during dev), it marks the existing schema as version 1
    # so future migrations apply cleanly on top.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8091

app:
  jwt:
    # Shared signing secret. MUST be identical across all services and MUST be
    # provided via the JWT_SECRET environment variable - there is deliberately
    # NO fallback value here, so a deployment that forgets to set it fails at
    # startup instead of silently using a known secret.
    #   generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  rate-limit:
    # Brute-force protection on /auth/login and /auth/register: at most
    # max-requests per IP per window-seconds (fixed-window, in-memory).
    # Scale up for production multi-instance deployments (Redis-backed).
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

---
# Dev profile: H2 in-memory, no install needed. Same pattern as the old
# monolith's dev profile.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:smart_traffic_auth;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # Own database - "smart_traffic_auth" - separate from traffic-service's
    # and routing-service's databases, and separate from any other project's
    # Postgres. Runs in the "smart-traffic-postgres" container on port 5433
    # (docker-compose.yml at the repo root), NOT the default 5432.
    # Credentials come from environment variables with local-dev fallbacks.
    #   docker compose up -d postgres
    #   psql -U postgres -h localhost -p 5433 -c "CREATE DATABASE smart_traffic_auth;"
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/smart_traffic_auth
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb_auth
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
