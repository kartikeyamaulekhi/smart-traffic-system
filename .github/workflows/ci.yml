name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The GitHub token only needs to read code and push packages to GHCR.
permissions:
  contents: read
  packages: write

env:
  # Arbitrary test-only value for unit tests. The real JWT_SECRET lives in
  # the local .env (dev) / GitHub Secrets (deploy) and is NEVER committed.
  JWT_SECRET: ci-test-only-secret-unused-in-production

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, traffic-service, routing-service, api-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn test -B --no-transfer-progress

  images:
    name: Build & push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
          - name: traffic-service
            context: ./traffic-service
          - name: routing-service
            context: ./routing-service
          - name: api-gateway
            context: ./api-gateway
          - name: ml-service
            context: ./ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max